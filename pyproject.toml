[project]
name = "vendor-due-diligence-verification"
version = "0.0.1"
description = "Evidence-based vendor due-diligence verification under independent agent context boundaries — testing whether independent, domain-scoped AI investigators catch verification errors a strong single-agent baseline misses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ankit Kaushik" }]

# Runtime dependencies are added incrementally, phase by phase, as they are
# actually needed — FastAPI etc. arrive starting Phase 9.
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "pypdf>=4.3",       # PDF text extraction (decision #10: PDF/DOCX/TXT/MD only)
    "defusedxml>=0.7",  # XXE-safe XML parsing for DOCX (ADR/security.md Phase 5 requirement)
    "anthropic>=0.40",  # sole LLM provider (ADR-001) — real calls only via app/llm/client.py
    "jsonschema>=4.22", # validates agent tool-call output (ADR-010) as well as eval ground truth
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx2>=2.13",  # tests/fakes.py constructs real anthropic.APIStatusError
                     # subclasses, which require a genuine response object —
                     # an undeclared transitive dep of anthropic until now,
                     # made explicit since test code imports it directly.
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic's own generator produces this exact style (Union/Sequence
# imports, long single-line column defs) and re-flowing every migration
# by hand each time buys nothing — migrations are quasi-generated and
# rarely hand-edited again once applied. Everything else in the repo is
# held to the full ruleset.
"alembic/versions/*.py" = ["E501", "UP007", "UP035"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only the application package is installed as a distributable package.
# eval/, alembic/, tests/, docs/ are used from the repo root directly (via
# pytest's rootdir and alembic's own working-directory config), not
# installed — an explicit include list, not automatic flat-layout
# discovery, which fails here with multiple top-level directories present.
include = ["app*"]
