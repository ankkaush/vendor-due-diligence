[project]
name = "vendor-due-diligence-verification"
version = "0.0.1"
description = "Evidence-based vendor due-diligence verification under independent agent context boundaries — testing whether independent, domain-scoped AI investigators catch verification errors a strong single-agent baseline misses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ankit Kaushik" }]

# Runtime dependencies are added incrementally, phase by phase, as they are
# actually needed (FastAPI/SQLAlchemy/Anthropic SDK etc. arrive in Phases
# 5-9) — not speculatively declared ahead of the code that uses them.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
# Evaluation-dataset tooling (Phase 3) — validates eval/ground_truth/*.json
# against eval/schema/ground_truth.schema.json. Not a runtime dependency of
# the application itself.
eval = [
    "jsonschema>=4.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
